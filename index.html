<!DOCTYPE html>
<html lang="ar" dir="rtl" id="main-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#006C35">
<title>دليل السعودية الشامل</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #f0f4f3; color: #333; padding-bottom: 20px; }
    .header { background: #006C35; color: white; padding: 10px; text-align: center; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 18px; margin-bottom: 10px; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
    .city-select { padding: 6px 10px; border-radius: 15px; border: none; background: #fff; color: #006C35; font-weight: bold; font-size: 13px; outline: none; cursor: pointer; max-width: 140px; }
    .container { padding: 15px; display: none; }
    .container.active { display: block; }
    .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .card { background: white; border-radius: 10px; padding: 10px 5px; text-align: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; border-bottom: 3px solid transparent; }
    .card:hover { transform: translateY(-2px); border-bottom-color: #006C35; }
    .card-icon { font-size: 24px; margin-bottom: 5px; }
    .card-title { font-size: 12px; font-weight: bold; color: #2c3e50; }
    .back-btn { background: #006C35; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
    .gps-btn { background: #2980b9; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .item-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-right: 5px solid #006C35; }
    .item-title { font-weight: bold; font-size: 16px; color: #2c3e50; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;}
    .rating-badge { background: #f1c40f; color: #333; padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
    .distance-badge { background: #e67e22; color: white; padding: 3px 8px; border-radius: 10px; font-size: 12px; display: none; }
    .item-address { font-size: 13px; color: #7f8c8d; margin-bottom: 10px; }
    .btn-group { display: flex; gap: 10px; }
    .action-btn { flex: 1; padding: 8px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: bold; font-size: 13px; color: white; }
    .map-btn { background: #27ae60; }
    .call-btn { background: #e74c3c; }
</style>
</head>

    allData[catName] = {};
    let brands = realBrands[catName] || [catName + ' المتميز', catName + ' المركزي', catName + ' الأول'];
    
    for (const city in cityCenters) {
        allData[catName][city] = [];
        for (let i = 0; i < 20; i++) {
            let brandName = brands[i % brands.length];
            let neighborhood = neighborhoods[i % neighborhoods.length];
            let name = brandName + ' - ' + neighborhood + ' - ' + city;
            let address = neighborhood + ' - ' + city;
            let lat = cityCenters[city][0] + (Math.random() - 0.5) * 0.1;
            let lng = cityCenters[city][1] + (Math.random() - 0.5) * 0.1;
            let rating = (Math.random() * 1.5 + 3.5).toFixed(1);
            let phone = emergencyNumbers[catName] ? emergencyNumbers[catName] : null;
            allData[catName][city].push([name, address, lat, lng, rating, phone]);

    }

function render() {
    const grid = document.getElementById('categories-grid');
    grid.innerHTML = '';
    allCats.forEach((c) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.onclick = () => openCat(c[1]);
        div.innerHTML = `<div class="card-icon">${c[0]}</div><div class="card-title">${c[1]}</div>`;
        grid.appendChild(div);
    });
}

function openCat(catName) {
    if (currCity === 'none' && catName !== 'القوانين واللوائح' && catName !== 'أخبار السعودية اليوم') {
        alert('من فضلك اختر مدينتك من الأعلى أولاً 📍'); return;
    }
    document.getElementById('home-view').classList.remove('active');
    document.getElementById('sub-view').classList.add('active');
    document.getElementById('sub-title').innerText = catName;
    const content = document.getElementById('sub-content');
    
    if (catName === 'أخبار السعودية اليوم' || catName === 'القوانين واللوائح') {
        content.innerHTML = `<div style="text-align:center; padding:40px; background:white; border-radius:12px;"><h2>جاري العمل</h2><p>سيتم إضافة بيانات هذا القسم قريباً.</p></div>`;
    } else {
        content.innerHTML = `<button class="gps-btn" onclick="findNearest('${catName}')">📍 اضغط لمعرفة الأقرب إليك</button><div id="items-list"></div>`;
        renderItemsList(allData[catName][currCity]);
    }
}

            <div class="item-address">📍 ${item[1]}</div>
            <div class="btn-group">
                <a href="https://www.google.com/maps/search/?api=1&query=${item[2]},${item[3]}" target="_blank" class="action-btn map-btn">🗺️ الخريطة</a>
                ${callHtml}
            </div>
        `;
        container.appendChild(div);
    });
}

function findNearest(catName) {
    const btn = document.querySelector('.gps-btn');
    btn.innerText = 'جاري تحديد موقعك...';
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition((position) => {
            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;
            let items = allData[catName][currCity] || [];
            let itemsWithDist = items.map(item => {
                const dist = calculateDistance(userLat, userLng, item[2], item[3]);
                return { data: item, distance: dist };
            });
            itemsWithDist.sort((a, b) => a.distance - b.distance);
            
            const container = document.getElementById('items-list');
            container.innerHTML = '';
            itemsWithDist.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-card';
                let callHtml = item.data[5] ? `<a href="tel:${item.data[5]}" class="action-btn call-btn">📞 ${item.data[5]}</a>` : '';
                
                div.innerHTML = `
                    <div class="item-title"><span>${item.data[0]}</span> <span class="rating-badge">⭐ ${item.data[4]}</span> <span class="distance-badge" style="display:inline-block;">🚗 ${item.distance} كم</span></div>
                    <div class="item-address">📍 ${item.data[1]}</div>
                    <div class="btn-group">
                        <a href="https://www.google.com/maps/search/?api=1&query=${item.data[2]},${item.data[3]}" target="_blank" class="action-btn map-btn">🗺️ الخريطة</a>
                        ${callHtml}
                    </div>
                `;
                container.appendChild(div);
            });
            btn.style.display = 'none';
        });
    }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return (R * c).toFixed(1);
}

function goHome() {
    document.getElementById('sub-view').classList.remove('active');
    document.getElementById('home-view').classList.add('active');
}

function changeCity(cityCode) {
    currCity = cityCode;
    if (document.getElementById('sub-view').classList.contains('active')) {
        const currentTitle = document.getElementById('sub-title').innerText;
        openCat(currentTitle);
    }
}

render();
</script>
