<!DOCTYPE html>
<html lang="ar" dir="rtl" id="main-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#006C35">
<link rel="manifest" href="/ahmed-guide/manifest.json">
<title>دليل السعودية الشامل</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #f0f4f3; color: #333; padding-bottom: 20px; }
    .header { background: #006C35; color: white; padding: 10px; text-align: center; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 18px; margin-bottom: 10px; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
    .lang-container { display: flex; gap: 3px; }
    .lang-btn { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 4px 8px; border-radius: 15px; cursor: pointer; font-size: 12px; }
    .lang-btn.active { background: white; color: #006C35; font-weight: bold; }
    .city-select { padding: 6px 10px; border-radius: 15px; border: none; background: #fff; color: #006C35; font-weight: bold; font-size: 13px; outline: none; cursor: pointer; max-width: 140px; }
    .container { padding: 15px; display: none; }
    .container.active { display: block; }
    .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .card { background: white; border-radius: 10px; padding: 10px 5px; text-align: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; align-items: center; border-bottom: 3px solid transparent; }
    .card:hover { transform: translateY(-2px); border-bottom-color: #006C35; }
    .card-icon { font-size: 24px; margin-bottom: 5px; }
    .card-title { font-size: 12px; font-weight: bold; color: #2c3e50; }
    .back-btn { background: #006C35; color: white; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; margin-bottom: 15px; display: inline-block; }
    .gps-btn { background: #2980b9; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .gps-btn:hover { background: #2471a3; }
    .item-card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-right: 5px solid #006C35; }
    .item-title { font-weight: bold; font-size: 16px; color: #2c3e50; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center;}
    .rating-badge { background: #f1c40f; color: #333; padding: 3px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
    .distance-badge { background: #e67e22; color: white; padding: 3px 8px; border-radius: 10px; font-size: 12px; display: none; }
    .item-address { font-size: 13px; color: #7f8c8d; margin-bottom: 10px; }
    .btn-group { display: flex; gap: 10px; }
    .action-btn { flex: 1; padding: 8px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: bold; font-size: 13px; color: white; }
    .map-btn { background: #27ae60; }
    .call-btn { background: #e74c3c; }
</style>
</head>
<body>
    <div class="header">
        <h1 id="app-title">دليل أحمد وعبده الشامل</h1>
        <div class="controls">
            <div class="lang-container">
                <button class="lang-btn active" onclick="changeLanguage('ar', event)">عربي</button>
                <button class="lang-btn" onclick="changeLanguage('en', event)">EN</button>
            </div>
            <select class="city-select" id="city-selector" onchange="changeCity(this.value)">
                <option value="none" selected>حدد مدينتك 📍</option>
                <option value="riyadh">الرياض</option>
                <option value="jeddah">جدة</option>
                <option value="makkah">مكة المكرمة</option>

                <option value="dammam">الدمام</option>
                <option value="khobar">الخبر</option>
                <option value="dhahran">الظهران</option>
                <option value="taif">الطائف</option>
                <option value="tabuk">تبوك</option>
                <option value="abha">أبها</option>
                <option value="buraidah">بريدة</option>
                <option value="hail">حائل</option>
                <option value="jazan">جيزان</option>
                <option value="najran">نجران</option>
                <option value="jubail">الجبيل</option>
                <option value="yanbu">ينبع</option>
                <option value="ahsa">الأحساء</option>
                <option value="arar">عرعر</option>
                <option value="sakaka">سكاكا</option>
                <option value="bahah">الباحة</option>
            </select>
        </div>
    </div>

    <div id="home-view" class="container active">
        <div class="grid-container" id="categories-grid"></div>
    </div>

    <div id="sub-view" class="container">
        <button class="back-btn" onclick="goHome()" id="btn-back">⬅ رجوع للرئيسية</button>
        <h2 id="sub-title" style="color: #006C35; margin-bottom: 15px; font-size: 20px;"></h2>
        <div id="sub-content"></div>
    </div>

let currLang = 'ar';
let currCity = 'none';

const cityCenters = {

const neighborhoods = ['حي العليا', 'حي الملز', 'حي النخيل', 'حي الروضة', 'حي الشاطئ', 'حي الأندلس', 'حي الفيصلية', 'حي المروج', 'حي الصحافة', 'حي الياسمين', 'حي السويدي', 'حي الشفاء', 'حي العزيزية', 'حي الحمراء', 'حي النزهة', 'حي الغدير', 'حي الورود', 'حي الملقا', 'حي حطين', 'حي القيروان'];

const cats = [
    ['📰','أخبار السعودية اليوم','KSA Daily News'], ['⚖️','القوانين واللوائح','New Laws'],
    ['🏥','المستشفيات الحكومية','Public Hospitals'], ['🏥','المستشفيات الخاصة','Private Hospitals'],
    ['💊','الصيدليات','Pharmacies'], ['🦷','عيادات الأسنان','Dental Clinics'],
    ['🧪','المختبرات الطبية','Medical Labs'], ['🩸','بنوك الدم','Blood Banks'],
    ['🩺','العيادات الخارجية','Outpatient Clinics'], ['🦴','العلاج الطبيعي','Physiotherapy'],
    ['👮','الشرطة والنجدة','Police'], ['🚒','الدفاع المدني','Civil Defense'],
    ['🚑','الإسعاف','Ambulance'], ['🛣️','أمن الطرق','Road Security'],
    ['💻','الأمن السيبراني','Cybersecurity'], ['🛂','حرس الحدود','Border Guard'],
    ['🍔','مطاعم الوجبات السريعة','Fast Food'], ['🍽️','مطاعم عائلية وفاخرة','Family Dining'],
    ['☕','المقاهي والكافيهات','Cafes'], ['🍰','الحلويات والجاتوه','Sweets'],
    ['🥖','المخابز','Bakeries'], ['🍲','خدمات التموين','Catering'],
    ['🛍️','المولات ومراكز التسوق','Malls'], ['👔','ملابس رجالي','Menswear'],
    ['👗','ملابس حريمي','Womenswear'], ['🧸','ملابس أطفال','Kidswear'],
    ['👟','الأحذية والحقائب','Shoes'], ['🧴','العطور','Perfumes'],
    ['💎','الذهب والمجوهرات','Gold'], ['📱','الإلكترونيات والهواتف','Electronics'],
    ['🛋️','الأثاث والمفروشات','Furniture'], ['🛒','السوبرماركت','Supermarkets'],
    ['🪀','محلات الألعاب','Toys'], ['📚','المكتبات والقرطاسية','Books'],
    ['👓','النظارات والبصريات','Optics'], ['💄','مستحضرات التجميل','Cosmetics'],
    ['🏫','المدارس الحكومية','Public Schools'], ['🏫','المدارس العالمية والأهلية','Private Schools'],
    ['🎓','الجامعات والكليات','Universities'], ['🧸','الحضانات ورياض الأطفال','Nurseries'],
    ['📜','مراكز التدريب والمعاهد','Training Centers'], ['📖','المكتبات العامة','Public Libraries'],
    ['🏛️','المنصات الحكومية','Gov Platforms'], ['🆔','الأحوال المدنية','Civil Affairs'],
    ['🏢','البلديات والأمانات','Municipalities'], ['🏦','البنوك وأجهزة الصراف','Banks'],
    ['💳','المحافظ الإلكترونية','E-Wallets'], ['💰','شركات التمويل','Finance'],
    ['🛡️','شركات التأمين','Insurance'], ['📡','شركات الاتصالات','Telecom'],
    ['📦','شركات الشحن والتوصيل','Shipping'], ['📮','مكاتب البريد','Post Offices'],
    ['⛽','محطات الوقود','Gas Stations'], ['🔧','صيانة السيارات','Car Repair'],
    ['🧺','المغاسل','Laundry'], ['📝','كتابات العدل','Notary'],
    ['🚗','الفحص الدوري','Car Inspection'], ['⚙️','قطع غيار السيارات','Spare Parts'],
    ['🛞','بنشر وإطارات','Tires'], ['🚘','وكلاء السيارات','Car Dealers'],
    ['🔑','تأجير السيارات','Car Rental'], ['🛣️','مدارس تعليم القيادة','Driving Schools'],
    ['🚇','النقل العام','Public Transport'], ['🚕','تطبيقات النقل','Ride Hailing'],
    ['🛠️','خدمات سيارات الغيار','Roadside Assist'], ['🔌','محطات الشحن الكهربائي','EV Charging'],
    ['🏞️','الحدائق والمنتزهات','Parks'], ['🎢','مدن الترفيه والملاهي','Theme Parks'],
    ['🎬','دور السينما','Cinemas'], ['🏛️','المتاحف والأماكن التاريخية','Museums'],
    ['🏨','الفنادق والشقق الفندقية','Hotels'], ['🏟️','الملاعب الرياضية','Stadiums'],
    ['🏋️','الصالات الرياضية','Gyms'], ['✈️','وكالات السفر','Travel Agencies'],
    ['🌾','المزارع السياحية','Tourist Farms'], ['⛺','المخيمات البرية','Desert Camps'],
    ['🚢','الرحلات البحرية','Sea Trips'], ['🏢','قاعات الاجتماعات','Conference Halls'],
    ['🏗️','شركات العقارات','Real Estate'], ['🏗️','شركات المقاولات','Contracting'],
    ['💼','مكاتب الاستقدام','Recruitment'], ['👔','منصات التوظيف','Job Platforms'],
    ['🖥️','المكاتب المشتركة','Coworking'], ['🏭','الشركات الصناعية','Industrial'],
    ['🕌','المساجد ومواقيت الصلاة','Mosques'], ['📖','مراكز تحفيظ القرآن','Quran Centers'],
    ['📢','مكاتب الدعوة والإرشاد','Dawah Offices'], ['⚖️','المحاكم (ناجز)','Courts'],
    ['❤️','الجمعيات الخيرية','Charities'], ['👴','دور رعاية المسنين','Elderly Care'],
    ['♿','مراكز ذوي الاحتياجات','Special Needs'], ['🐾','العيادات البيطرية','Vets'],
    ['⚽','أخبار الرياضة','Sports News'], ['🏅','الأندية الرياضية','Sports Clubs'],
    ['🏃','أكاديميات تدريب','Sports Academies'], ['👟','المعدات الرياضية','Sports Gear']
];

// كود توليد البيانات لجميع الأقسام (96 قسم × 20 مدينة × 20 فرع)
const allData = {};
cats.forEach(c => {
    let catName = c[1];
    if (catName === 'أخبار السعودية اليوم' || catName === 'القوانين واللوائح') return; 
    
    allData[catName] = {};
    for (const city in cityCenters) {
        allData[catName][city] = [];
        let prefix = cityCenters[city][2];
        for (let i = 0; i < 20; i++) {
            let name = catName + ' ' + (i + 1) + ' - ' + city;
            let address = neighborhoods[i % neighborhoods.length] + ' - ' + city;
            let lat = cityCenters[city][0] + (Math.random() - 0.5) * 0.1;
            let lng = cityCenters[city][1] + (Math.random() - 0.5) * 0.1;
            let rating = (Math.random() * 1.5 + 3.5).toFixed(1);
            let phone = prefix + Math.floor(1000000 + Math.random() * 9000000).toString();
            allData[catName][city].push([name, address, lat, lng, rating, phone]);
        }
    }
});

function render() {
    const grid = document.getElementById('categories-grid');
    grid.innerHTML = '';
    cats.forEach((c, i) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.onclick = () => openCat(c);
        div.innerHTML = `<div class="card-icon">${c[0]}</div><div class="card-title">${c[currLang==='ar'?1:2]}</div>`;
        grid.appendChild(div);
    });
}

function openCat(c) {
    if (currCity === 'none' && c[1] !== 'القوانين واللوائح' && c[1] !== 'أخبار السعودية اليوم') {
        alert(ui[currLang].selectCityAlert);
        return;
    }
    document.getElementById('home-view').classList.remove('active');
    document.getElementById('sub-view').classList.add('active');
    document.getElementById('sub-title').innerText = c[currLang==='ar'?1:2];
    document.getElementById('btn-back').innerText = ui[currLang].back;
    const content = document.getElementById('sub-content');
    
    if (c[1] === 'أخبار السعودية اليوم' || c[1] === 'القوانين واللوائح') {
        content.innerHTML = `<div style="text-align:center; padding:40px; background:white; border-radius:12px;"><h2>جاري العمل</h2><p>سيتم إضافة بيانات هذا القسم قريباً.</p></div>`;
    } else {
        const catData = allData[c[1]];
        if (catData && catData[currCity]) {
            content.innerHTML = `<button class="gps-btn" id="gps-btn" onclick="findNearest('custom')">${ui[currLang].gpsBtn}</button><div id="items-list"></div>`;
            renderItemsList(catData[currCity], 'custom');
        }
    }
}

function renderItemsList(items, type) {
    const container = document.getElementById('items-list');
    container.innerHTML = '';
    if (items.length === 0) return;
    items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        const mapLink = `https://www.google.com/maps/search/?api=1&query=${item[2]},${item[3]}`;
        let ratingHtml = item[4] ? `<span class="rating-badge">⭐ ${item[4]}</span>` : '';
        let callHtml = item[5] ? `<a href="tel:${item[5]}" class="action-btn call-btn">📞 ${item[5]}</a>` : '';
        
        div.innerHTML = `
            <div class="item-title"><span>${item[0]}</span> ${ratingHtml} <span class="distance-badge" id="dist-${item[2]}"></span></div>
            <div class="item-address">📍 ${item[1]}</div>
            <div class="btn-group">
                <a href="${mapLink}" target="_blank" class="action-btn map-btn">🗺️ ${ui[currLang].map}</a>
                ${callHtml}
            </div>
        `;
        container.appendChild(div);
    });
}

function findNearest(type) {
    const btn = document.getElementById('gps-btn');
    btn.innerText = ui[currLang].loadingGps;
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const userLat = position.coords.latitude;
                const userLng = position.coords.longitude;
                let items = [];
                const activeCat = document.getElementById('sub-title').innerText;
                const catData = allData[activeCat];
                items = catData ? catData[currCity] : [];
                
                let itemsWithDistance = items.map(item => {
                    const dist = calculateDistance(userLat, userLng, item[2], item[3]);
                    return { data: item, distance: dist };
                });
                itemsWithDistance.sort((a, b) => a.distance - b.distance);
                renderSortedItems(itemsWithDistance, type);
                btn.style.display = 'none';
            },
            (error) => { alert('الرجاء السماح بالوصول للموقع.'); btn.innerText = ui[currLang].gpsBtn; }
        );
    }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return (R * c).toFixed(1);
}

function renderSortedItems(items, type) {
    const container = document.getElementById('items-list');
    container.innerHTML = '';
    items.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        const mapLink = `https://www.google.com/maps/search/?api=1&query=${item.data[2]},${item.data[3]}`;
        let ratingHtml = item.data[4] ? `<span class="rating-badge">⭐ ${item.data[4]}</span>` : '';
        let callHtml = item.data[5] ? `<a href="tel:${item.data[5]}" class="action-btn call-btn">📞 ${item.data[5]}</a>` : '';

        div.innerHTML = `
            <div class="item-title"><span>${item.data[0]}</span> ${ratingHtml} <span class="distance-badge" style="display:inline-block;">🚗 ${item.distance} كم</span></div>
            <div class="item-address">📍 ${item.data[1]}</div>
            <div class="btn-group">
                <a href="${mapLink}" target="_blank" class="action-btn map-btn">🗺️ ${ui[currLang].map}</a>
                ${callHtml}
            </div>
        `;
        container.appendChild(div);
    });
}

function goHome() {
    document.getElementById('sub-view').classList.remove('active');
    document.getElementById('home-view').classList.add('active');
}

function changeLanguage(lang, e) {
    currLang = lang;
    document.getElementById('app-title').innerText = ui[lang].title;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    render(); goHome();
}

function changeCity(cityCode) {
    currCity = cityCode;
    if (document.getElementById('sub-view').classList.contains('active')) {
        const currentTitle = document.getElementById('sub-title').innerText;
        const activeCat = cats.find(c => c[1] === currentTitle || c[2] === currentTitle);
        if(activeCat) openCat(activeCat);
    }
}

render();

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/ahmed-guide/sw.js')
            .then(registration => { console.log('ServiceWorker registered'); })
            .catch(err => { console.log('ServiceWorker registration failed: ', err); });
    });
}
</script>

</html>
